<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Good Point · аналитика</title>
<style>
:root{--bg:#f8f3ec;--surface:#fffdf9;--ink:#2a2622;--muted:#7a6f66;--line:#ecdfd2;--accent:#d9643a;--accent-soft:#fde3d6;--bad:#d03b3b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1815;--surface:#25211d;--ink:#f2ebe3;--muted:#b9ada1;--line:#3a332c;--accent:#f09a74;--accent-soft:#4a2e22;--bad:#e66767;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;display:grid;gap:14px}
h1{margin:0;font-size:22px;letter-spacing:-.01em}h1 i{font-style:normal;color:var(--accent);font-weight:500;font-size:15px;margin-left:6px}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;padding:11px 14px;border-radius:999px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
.row{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}.row input{width:auto}
</style>
</head>
<body>
<form id="f">
  <h1>Good Point<i>аналитика</i></h1>
  <p>Внутренний отчёт. Введите пароль, чтобы открыть.</p>
  <label for="pw">Пароль</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <div class="row"><input id="rem" type="checkbox"><label for="rem" style="all:unset">Запомнить на этом устройстве</label></div>
  <button id="go" type="submit">Открыть отчёт</button>
  <div class="err" id="err" role="alert"></div>
</form>

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function keyFrom(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
async function show(key){const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
  const html=new TextDecoder().decode(buf);document.open();document.write(html);document.close()}
(async()=>{try{const raw=localStorage.getItem(K);if(raw){const key=await crypto.subtle.importKey('raw',u8(raw),'AES-GCM',true,['decrypt']);await show(key)}}catch(e){try{localStorage.removeItem(K)}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');
  b.disabled=true;b.textContent='Проверяю…';er.textContent='';
  try{const key=await keyFrom(document.getElementById('pw').value);
    if(document.getElementById('rem').checked){try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));localStorage.setItem(K,btoa(String.fromCharCode(...raw)))}catch(_){}}
    await show(key)}
  catch(_){er.textContent='Неверный пароль. Проверьте раскладку и Caps Lock.';b.disabled=false;b.textContent='Открыть отчёт'}});
})();
